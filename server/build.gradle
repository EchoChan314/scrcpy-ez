apply plugin: 'com.android.application'

android {
    namespace = 'com.genymobile.scrcpy'
    compileSdk = 36
    defaultConfig {
        applicationId = "com.genymobile.scrcpy"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 50001
        versionName "5.0.1-ez2.4.1-release"
        testInstrumentationRunner = "android.support.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    buildFeatures {
        buildConfig = true
        aidl = true
    }
    lint {
        disable 'UseRequiresApi'
        // The server is injected via app_process under the adb shell uid and
        // reaches hidden framework APIs (ActivityTaskManager.getService, …) by
        // reflection by design — that is how scrcpy controls app tasks and
        // virtual displays. Lint's BlockedPrivateApi check is meant for regular
        // apps and flags those reflective calls as fatal under targetSdk 36.
        disable 'BlockedPrivateApi'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

apply from: "$project.rootDir/config/android-checkstyle.gradle"
