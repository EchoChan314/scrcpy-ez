// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.1.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    // The server keeps minSdk 21 compatibility, so it must call framework APIs
    // that newer SDKs deprecated (Looper.prepareMainLooper, Display.getRealMetrics,
    // BaseBundle.get, …). Reporting them on every release build only adds noise
    // to the CI annotations, so deprecation warnings stay off.
    tasks.withType(JavaCompile) {
        options.compilerArgs << "-Xlint:-deprecation"
    }
}
