name: Auto build win64

# 源码一有更新就自动构建，并把成品发布到 GitHub Release，
# 本地用 update-scrcpy-ez.ps1 一键拉取。
on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      name:
        description: 'Version label (default: autobuild)'

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.name || 'autobuild' }}

jobs:
  build-scrcpy-server:
    runs-on: ubuntu-latest
    env:
      GRADLE: gradle
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build
        run: |
          git ls-files -z -- '*.sh' gradlew run bump_version | xargs -0 chmod +x
          release/build_server.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: scrcpy-server
          path: release/work/build-server/server/scrcpy-server

  build-win64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y meson ninja-build nasm \
             mingw-w64 mingw-w64-tools libz-mingw-w64-dev

      - name: Build
        run: |
          git ls-files -z -- '*.sh' gradlew run bump_version | xargs -0 chmod +x
          release/build_windows.sh 64

      - name: Tar
        run: |
          cd release/work/build-win64
          mkdir dist-tar
          cd dist-tar
          tar -C .. -cvf dist.tar.gz dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-win64-intermediate
          path: release/work/build-win64/dist-tar/

  package-win64:
    needs:
      - build-scrcpy-server
      - build-win64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download scrcpy-server
        uses: actions/download-artifact@v8
        with:
          name: scrcpy-server
          path: release/work/build-server/server/

      - name: Download build-win64
        uses: actions/download-artifact@v8
        with:
          name: build-win64-intermediate
          path: release/work/build-win64/dist-tar/

      - name: Detar
        run: |
          cd release/work/build-win64
          tar xf dist-tar/dist.tar.gz

      - name: Package
        run: |
          git ls-files -z -- '*.sh' gradlew run bump_version | xargs -0 chmod +x
          release/package_client.sh win64 zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-win64
          path: release/output/

  publish-release:
    needs: package-win64
    runs-on: ubuntu-latest
    steps:
      - name: Download win64 package
        uses: actions/download-artifact@v8
        with:
          name: release-win64
          path: out

      - name: Publish build release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd out
          zip=$(ls scrcpy-win64-*.zip | head -1)
          cp "$zip" scrcpy-ez-win64.zip
          # One release per build, tagged with the exact commit: the
          # auto-generated "Source code" archives then always match the
          # binary. A rolling tag cannot be moved from Actions (the git
          # refs API is 403 for the GITHUB_TOKEN on this fork), which is
          # why the previous latest-build release drifted.
          TAG="build-$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA:0:7}"
          gh release create "$TAG" \
            --title "scrcpy-ez build ${GITHUB_SHA:0:7}" \
            --notes "commit $GITHUB_SHA | built $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            scrcpy-ez-win64.zip
          # Prune old build releases, keeping the two newest
          gh release list --limit 50 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("build-"))] | sort_by(.createdAt) | reverse | .[2:][] | .tagName' \
            | xargs -r -n1 sh -c 'gh release delete "$0" --yes'
          echo "Published: https://github.com/$GH_REPO/releases/tag/$TAG"
