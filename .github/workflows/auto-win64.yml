name: Auto build win64

# 源码一有更新就自动构建，并把成品发布到 GitHub Release，
# 本地用 update-scrcpy-ez.ps1 一键拉取。
on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      name:
        description: 'Version label (default: autobuild)'

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.name || 'autobuild' }}

jobs:
  build-scrcpy-server:
    runs-on: ubuntu-latest
    env:
      GRADLE: gradle
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build
        run: |
          git ls-files -z -- '*.sh' gradlew run bump_version | xargs -0 chmod +x
          release/build_server.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: scrcpy-server
          path: release/work/build-server/server/scrcpy-server

  build-win64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y meson ninja-build nasm \
             mingw-w64 mingw-w64-tools libz-mingw-w64-dev

      - name: Build
        run: |
          git ls-files -z -- '*.sh' gradlew run bump_version | xargs -0 chmod +x
          release/build_windows.sh 64

      - name: Tar
        run: |
          cd release/work/build-win64
          mkdir dist-tar
          cd dist-tar
          tar -C .. -cvf dist.tar.gz dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-win64-intermediate
          path: release/work/build-win64/dist-tar/

  package-win64:
    needs:
      - build-scrcpy-server
      - build-win64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download scrcpy-server
        uses: actions/download-artifact@v8
        with:
          name: scrcpy-server
          path: release/work/build-server/server/

      - name: Download build-win64
        uses: actions/download-artifact@v8
        with:
          name: build-win64-intermediate
          path: release/work/build-win64/dist-tar/

      - name: Detar
        run: |
          cd release/work/build-win64
          tar xf dist-tar/dist.tar.gz

      - name: Package
        run: |
          git ls-files -z -- '*.sh' gradlew run bump_version | xargs -0 chmod +x
          release/package_client.sh win64 zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-win64
          path: release/output/

  publish-release:
    needs: package-win64
    runs-on: ubuntu-latest
    steps:
      - name: Download win64 package
        uses: actions/download-artifact@v8
        with:
          name: release-win64
          path: out

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd out
          zip=$(ls scrcpy-win64-*.zip | head -1)
          cp "$zip" scrcpy-ez-win64.zip
          TAG=latest-build
          NOTES="commit ${{ github.sha }} | built $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "scrcpy-ez latest build" --notes "$NOTES"
          else
            gh release create "$TAG" --title "scrcpy-ez latest build" --notes "$NOTES"
          fi
          gh release upload "$TAG" scrcpy-ez-win64.zip --clobber
          echo "Published: https://github.com/$GH_REPO/releases/tag/$TAG"
